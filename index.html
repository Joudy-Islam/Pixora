<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width , initial-scale=1.0" />
    <title>Pixora</title>
    <link rel="stylesheet" href="style.css" />
    <script src="canvas.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="web">
                <div class="brand">
                    <img src="Photos/new_logo.png" alt="Pixora Logo" />
                    <div class="Brand-text">
                    <h1 id="Pixora-title">Pixora</h1>
                    <span id="Theme-name">🍂--Harvest Season--</span>
                </div>
                </div>
                <div class="btns">
                    <button class="icon-btn" id="undo-btn" type="button" aria-label="undo last action">
                        <img class="imgg" src="Photos/undo.svg">

                    </button>
                    <button class="icon-btn" id="redo-btn" type="button" aria-label="Redo last action">
                        <img class="imgg" src="Photos/redo.svg">
                    </button>

                    <button class="primary-btn" id="export-btn" type="button">
                        <img class="img" src="Photos/export.svg" alt="export logo">
                        Export
                    </button>
                    <button class="theme-btn" id="light-dark-mood-btn" type="button" aria-label="Switch to light mood"
                        aria-pressed="false">
                        <img src="Photos/light.svg" alt="sun" id="theme-icon" />
                    </button>
                </div>
            </div>
        </header>

        <main class="workspace">
            <aside class="left-panel">
                <h2>Tools</h2>
                <h2>Canvas</h2>
                <h2>Colors</h2>
            </aside>
            <!--Canvas-->
            <section class="studio">
                <div class="canvas-container">
                    <canvas id="pixelCanvas"></canvas>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
