<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width , initial-scale=1.0" />
    <title>Pixora</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&family=VT323&display=swap"
        rel="stylesheet">


</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="web">
                <div class="brand">
                    <img src="Photos/new_logo.png" alt="Pixora Logo" />
                    <div class="Brand-text">
                        <h1 id="Pixora-title">Pixora</h1>
                        <span id="Theme-name">🍂--Harvest Season--</span>
                    </div>
                </div>
                <div class="btns">
                    <button class="icon-btn" id="undo-btn" type="button" aria-label="undo last action">
                        <img class="imgg" src="Photos/undo.svg">

                    </button>
                    <button class="icon-btn" id="redo-btn" type="button" aria-label="Redo last action">
                        <img class="imgg" src="Photos/redo.svg">
                    </button>

                    <button class="primary-btn" id="export-btn" type="button">
                        <img class="img" src="Photos/export.svg" alt="export logo">
                        Export
                    </button>
                    <button class="theme-btn" id="light-dark-mood-btn" type="button" aria-label="Switch to light mood"
                        aria-pressed="false">
                        <img src="Photos/light.svg" alt="sun" id="theme-icon" />
                    </button>
                </div>
            </div>
        </header>

        <main class="workspace">
            <aside class="left-panel">
                <span id="text">PIXEL STUDIO</span>
                <h2>Tools</h2>
                <div class="divider-line"></div>
                <h4 class="texxt">Drawing tools</h4>
                <button class="tools" id="pencil" type="button">
                    <img class="imgg" src="Photos/pencil.svg" alt="Pencile-icon">Pencil
                </button>
                <button class="tools" id="eraser" type="button">
                    <img class="imgg" src="Photos/eraser.svg" alt="eraser-icon">Eraser
                </button>
                <button class="tools" id="fill" type="button">
                    <img class="imgg" src="Photos/fill.svg" alt="fill-icon">Fill
                </button>
                <button class="tools" id="picker" type="button">
                    <img class="imgg" src="Photos/color-picker.svg" alt="color-picker-logo">picker
                </button>
                <div class="divider-line"></div>

                <h4 class="texxt">Canvas size</h4>
                <label for="gridSize">Grid Size</label>
                <select id="gridSize">
                    <option value="8">8 x 8</option>
                    <option value="16">16 x 16</option>
                    <option value="32">32 x 32</option>
                    <option value="64">64 x 64</option>

                </select>
                <!--COLORSSSS!!-->
                <section class="colors-section">
                    <h4 class="texxt">Colors</h4>
                    <div class="current-color-row">
                        <div class="current-color" id="currentColorDisplay"></div>
                        <div class="color-input-wrapper">
                            <span class="color-label">
                                Current color
                            </span>
                            <input type="text" id="colorValue" value="#FF8B3D" maxlength="7"
                                aria-label="Current color hex value">

                        </div>
                        <label for="colorPicker" class="color-picker-btn" aria-label="Open color picker">
                            <img src="Photos/color-picker.svg" alt="Color picker">
                        </label>

                        <input type="color" id="colorPicker" value="#FF8B3D" hidden>
                    </div>
                    <div class="color-palette" id="colorPallete">

                        <button type="button" class="color-swatch" data-color="#FFF1D6"
                            style="background-color: #FFF1D6;" aria-label="Select color #FFF1D6"></button>
                        <button type="button" class="color-swatch" data-color="#FFC857"
                            style="background-color: #FFC857;" aria-label="Select color #FFC857"></button>


                        <button type="button" class="color-swatch" data-color="#FF9F1C"
                            style="background-color: #FF9F1C;" aria-label="Select color #FF9F1C"></button>

                        <button type="button" class="color-swatch" data-color="#E85D2A"
                            style="background-color: #E85D2A;" aria-label="Select color #E85D2A"></button>

                        <button type="button" class="color-swatch" data-color="#A9432B"
                            style="background-color: #A9432B;" aria-label="Select color #A9432B"></button>

                        <button type="button" class="color-swatch" data-color="#65352B"
                            style="background-color: #65352B;" aria-label="Select color #65352B"></button>

                        <button type="button" class="color-swatch" data-color="#3B2926"
                            style="background-color: #3B2926;" aria-label="Select-color #3B2926"></button>

                    </div>
                </section>
                </section>
            </aside>
            <!--Canvas-->
            <section class="studio">
                <div class="canvas-container">
                    <canvas id="pixelCanvas"></canvas>
                </div>
            </section>
            <!--Animation-->
            <section id="animation">
                <h1> Animation</h1>
                <section id="preview">
                    <div id="preview_box">
                        <img id="preview_image" src="" alt="Animation preview">
                        <p id="empty_message">No frame selected</p>

                    </div>
                </section>

                <section id="controls">
                    <button id="play"> Play</button>
                    <button id="pause">Pause</button>
                </section>

                <section id="frames">
                    <div id="header">
                        <h3> Frames</h3>
                        <input id="frameinput" type="file" multiple style="display:none">
                        <button id="add">Add</button>
                    </div>
                    <div id="container"></div>
                </section>
            </section>
        </main>

    </div>
    <script src="canvas.js" defer></script>
    <script src="Animation.js"></script>
</body>

</html>
